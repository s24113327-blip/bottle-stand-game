<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STAND-BY-ME | Bottle Challenge</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="game-wrapper">
    <header class="title-container">
        <h1 class="outer-game-title">STAND-BY-ME</h1>
    </header>

    <div class="main-layout">
        <div class="canvas-area">
            <div id="status">Hook the cap!</div>
            <canvas id="gameCanvas"></canvas>

            <div id="tutorialOverlay" class="overlay">
                <p>Hook the bottle and pull it upright!</p>
                <button id="startBtn">START GAME</button>
            </div>

            <div id="pauseOverlay" class="overlay hidden">
                <h1>PAUSED</h1>
                <button id="resumeBtn">RESUME</button>
                <button id="resetBtn">QUIT</button>
            </div>

            <div id="gameOverOverlay" class="overlay hidden">
                <h2 id="deathReason">GAME OVER</h2>
                <p>Final Score: <span id="finalScore">0</span></p>
                <button id="restartBtn">TRY AGAIN</button>
            </div>
            
            <button id="pauseBtn">II</button>
        </div>

        <div class="sidebar">
            <div class="sidebar-header">PROGRESSION</div>
            <ul id="levelList"></ul>
            
            <div class="objectives">
                <div class="sidebar-header">SKIN UNLOCKS</div>
                <div id="skinObjective" class="objective-item">
                    <div id="skinStatus">Next: Lv 5 Sapphire</div>
                </div>
                <div class="skin-preview-grid">
                    <div class="dot green active"></div>
                    <div class="dot blue"></div>
                    <div class="dot red"></div>
                    <div class="dot black"></div>
                    <div class="dot purple"></div>
                </div>
            </div>

            <div class="sidebar-stats">
                <div class="stat-box"><span>SCORE</span><span id="score">0</span></div>
                <div class="stat-box"><span>BEST</span><span id="bestScore">0</span></div>
                <div class="stat-box"><span>LEVEL</span><span id="level">1</span></div>
            </div>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
